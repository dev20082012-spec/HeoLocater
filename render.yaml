services:
  - type: web
    name: lifelane-route
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: V2X_BROKER_URL
        value: mqtts://broker.lifelane.internal:8883
      - key: V2X_CLIENT_ID
        value: AMB_NODE_108
      - key: V2X_PREEMPTION_TOPIC
        value: /v2x/corridor/preemption
      - key: V2X_TELEMETRY_INTERVAL_MS
        value: 100
      - key: TRAFFIC_API_PROVIDER
        value: tomtom
      - key: TOMTOM_API_KEY
        value: demo_key
      - key: PCR_RESPONSE_TIMEOUT_SEC
        value: 15
      - key: SCATS_OVERRIDE_HOLD_SEC
        value: 35
